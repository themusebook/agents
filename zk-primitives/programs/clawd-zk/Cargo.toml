[package]
name = "clawd-zk"
version = "0.1.0"
description = "ZK primitive for Solana Clawd AI model attestations: nullifiers, Groth16 proofs, compressed state via Light Protocol"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Solizardking/solana-clawd"

[lib]
crate-type = ["cdylib", "lib"]
name = "clawd_zk"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
# Light SDK 0.23 is the last release built on Anchor 0.31 / Solana 2.x.
# 0.24 moved to Anchor 1.x / Solana 3-4, which creates incompatible
# AccountInfo and Borsh types when combined with this program's Anchor stack.
light-sdk = { version = "0.23.0", features = ["anchor", "v2"] }
light-hasher = "5.0"
groth16-solana = "0.2"
borsh = "0.10"
bytemuck = { version = "1.18", features = ["derive", "min_const_generics"] }
solana-program = "2.3"
hex = "0.4"

[dev-dependencies]
solana-program-test = "2.3"
solana-sdk = "2.3"
anchor-client = { version = "0.31.1", features = ["mock"] }
tokio = { version = "1", features = ["full"] }
