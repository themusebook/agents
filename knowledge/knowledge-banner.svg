<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="OpenClawd Knowledge Base — injectable agent memory">
  <defs>
    <linearGradient id="kbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07050f"/>
      <stop offset="45%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#05140f"/>
    </linearGradient>
    <linearGradient id="kbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9945FF">
        <animate attributeName="stop-color" values="#9945FF;#14F195;#00C805;#9945FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#14F195">
        <animate attributeName="stop-color" values="#14F195;#00C805;#9945FF;#14F195" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00C805">
        <animate attributeName="stop-color" values="#00C805;#9945FF;#14F195;#00C805" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="kbScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9945FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#14F195" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00C805" stop-opacity="0"/>
    </linearGradient>
    <filter id="kbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="kbSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#kbBg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="url(#kbGrad)" stroke-width="1.6" opacity="0.75">
    <animate attributeName="opacity" values="0.45;0.95;0.45" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- ambient orbs -->
  <circle cx="160" cy="80" r="72" fill="#9945FF" opacity="0.09" filter="url(#kbSoft)">
    <animate attributeName="opacity" values="0.05;0.14;0.05" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="230" r="88" fill="#14F195" opacity="0.08" filter="url(#kbSoft)">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="50" r="48" fill="#00C805" opacity="0.07" filter="url(#kbSoft)">
    <animate attributeName="opacity" values="0.04;0.12;0.04" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- grid -->
  <g stroke="#9945FF" stroke-opacity="0.07" stroke-width="1">
    <path d="M40 80 H1160"/><path d="M40 140 H1160"/><path d="M40 200 H1160"/><path d="M40 260 H1160"/>
    <path d="M200 40 V280"/><path d="M400 40 V280"/><path d="M600 40 V280"/><path d="M800 40 V280"/><path d="M1000 40 V280"/>
  </g>

  <!-- scan -->
  <rect x="40" width="1120" height="26" fill="url(#kbScan)" opacity="0.75">
    <animate attributeName="y" values="42;268;42" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- orbiting bits -->
  <circle r="5" fill="#9945FF" filter="url(#kbGlow)">
    <animateMotion dur="9s" repeatCount="indefinite" path="M130,165 a210,85 0 1,1 0,1"/>
  </circle>
  <circle r="4" fill="#14F195" filter="url(#kbGlow)">
    <animateMotion dur="12s" repeatCount="indefinite" path="M1070,155 a190,75 0 1,0 0,1"/>
  </circle>

  <!-- LIVE pill -->
  <g transform="translate(70 36)">
    <rect width="78" height="26" rx="13" fill="#052e16" stroke="#00C805" stroke-width="1.4"/>
    <circle cx="16" cy="13" r="4" fill="#00C805" filter="url(#kbGlow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3.5;5;3.5" dur="1.15s" repeatCount="indefinite"/>
    </circle>
    <text x="48" y="17" text-anchor="middle" fill="#86efac" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">LIVE</text>
  </g>

  <!-- brain / book mark -->
  <g transform="translate(70 95)">
    <rect width="100" height="100" rx="22" fill="#0a0a0f" stroke="#9945FF" stroke-width="2.5"/>
    <!-- open book -->
    <path d="M22 38 Q50 28 50 70 Q50 28 78 38 L78 78 Q50 68 50 78 Q50 68 22 78 Z" fill="none" stroke="#14F195" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="50" y1="32" x2="50" y2="78" stroke="#a78bfa" stroke-width="1.5"/>
    <!-- pulsing spark -->
    <circle cx="50" cy="50" r="4" fill="#14F195" filter="url(#kbGlow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- titles -->
  <text x="210" y="118" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="40" font-weight="800" fill="#fafafa" letter-spacing="-0.6">
    OpenClawd Knowledge Base
  </text>
  <text x="210" y="154" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="url(#kbGrad)" filter="url(#kbGlow)">
    facts · patterns · gotchas · decisions → harness inject
  </text>
  <text x="210" y="188" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#a1a1aa">
    Upload md / txt / json / jsonl / pdf / images · one script · system instructions for agents
  </text>

  <!-- pills -->
  <g transform="translate(210 214)">
    <rect width="108" height="28" rx="14" fill="#1a1030" stroke="#9945FF" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="54" y="19" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" fill="#c4b5fd">JSONL FACTS</text>
  </g>
  <g transform="translate(330 214)">
    <rect width="120" height="28" rx="14" fill="#052e1a" stroke="#14F195" stroke-width="1.2"/>
    <text x="60" y="19" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">ONE-SHOT INJECT</text>
  </g>
  <g transform="translate(462 214)">
    <rect width="128" height="28" rx="14" fill="#0c1a12" stroke="#00C805" stroke-width="1.2"/>
    <text x="64" y="19" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" fill="#86efac">.GROK/RULES</text>
  </g>
  <g transform="translate(602 214)">
    <rect width="132" height="28" rx="14" fill="#1c1917" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="66" y="19" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" fill="#fcd34d">SAFE RE-RUNS</text>
  </g>

  <!-- stream panel -->
  <g transform="translate(980 92)" font-family="ui-monospace,Menlo,monospace" font-size="12">
    <rect width="168" height="140" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <text x="14" y="28" fill="#71717a">inject</text>
    <text x="14" y="52" fill="#c4b5fd">
      discover
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.4s" repeatCount="indefinite"/>
    </text>
    <text x="14" y="74" fill="#14F195">
      extract ▌
      <animate attributeName="opacity" values="1;0.25;1" dur="0.95s" repeatCount="indefinite"/>
    </text>
    <text x="14" y="96" fill="#a78bfa">normalize</text>
    <text x="14" y="118" fill="#86efac">render → rules</text>
  </g>
</svg>
