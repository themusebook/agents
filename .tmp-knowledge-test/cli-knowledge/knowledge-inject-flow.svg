<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="Knowledge inject pipeline: upload → extract → normalize → harness rules">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="50%" stop-color="#14F195"/>
      <stop offset="100%" stop-color="#00C805"/>
    </linearGradient>
    <filter id="fg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="920" height="220" rx="14" fill="#09090b"/>
  <rect x="1" y="1" width="918" height="218" rx="13" fill="none" stroke="url(#flow)" stroke-width="1" opacity="0.35"/>

  <text x="460" y="36" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" letter-spacing="1.8">KNOWLEDGE → HARNESS SYSTEM INSTRUCTIONS</text>

  <!-- spine -->
  <path d="M70 110 H850" stroke="url(#flow)" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
  <circle r="6" fill="#14F195" filter="url(#fg)">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M70 110 H850"/>
  </circle>
  <circle r="4" fill="#9945FF" filter="url(#fg)">
    <animateMotion dur="4.5s" begin="1.5s" repeatCount="indefinite" path="M70 110 H850"/>
  </circle>

  <!-- nodes -->
  <g font-family="ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <g transform="translate(90 110)">
      <circle r="22" fill="#18181b" stroke="#9945FF" stroke-width="2"/>
      <text y="4" fill="#e4e4e7" font-size="13" font-weight="700">⬆</text>
      <text y="48" fill="#d4d4d8" font-size="11">Upload</text>
      <text y="64" fill="#71717a" font-size="9">md json pdf img</text>
    </g>
    <g transform="translate(250 110)">
      <circle r="22" fill="#18181b" stroke="#a78bfa" stroke-width="2"/>
      <text y="4" fill="#e4e4e7" font-size="12" font-weight="700">⚙</text>
      <text y="48" fill="#d4d4d8" font-size="11">Extract</text>
      <text y="64" fill="#71717a" font-size="9">text · OCR skip-safe</text>
    </g>
    <g transform="translate(410 110)">
      <circle r="22" fill="#18181b" stroke="#14F195" stroke-width="2"/>
      <text y="4" fill="#e4e4e7" font-size="12" font-weight="700">∑</text>
      <text y="48" fill="#d4d4d8" font-size="11">Normalize</text>
      <text y="64" fill="#71717a" font-size="9">facts + excerpts</text>
    </g>
    <g transform="translate(570 110)">
      <circle r="22" fill="#18181b" stroke="#34d399" stroke-width="2"/>
      <text y="4" fill="#e4e4e7" font-size="12" font-weight="700">✎</text>
      <text y="48" fill="#d4d4d8" font-size="11">Render</text>
      <text y="64" fill="#71717a" font-size="9">system instructions</text>
    </g>
    <g transform="translate(740 110)">
      <circle r="22" fill="#18181b" stroke="#00C805" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text y="4" fill="#86efac" font-size="12" font-weight="700">✓</text>
      <text y="48" fill="#d4d4d8" font-size="11">.grok/rules</text>
      <text y="64" fill="#71717a" font-size="9">auto-loaded by Grok</text>
    </g>
  </g>

  <text x="460" y="200" text-anchor="middle" fill="#52525b" font-family="ui-monospace,Menlo,monospace" font-size="11">
    npm run knowledge:inject
  </text>
</svg>
